name: Continuous Integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  exe:
    name: Native (exe)
    uses: ./.github/workflows/build-exe.yml
  node:
    name: Node
    uses: ./.github/workflows/build-node.yml
  release:
    name: Release
    needs: [exe, node]
    # Any tag push drafts a release - "0.2.0" and "v0.2.0" both work; release.yml checks the tag
    # against shared/VERSION.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
