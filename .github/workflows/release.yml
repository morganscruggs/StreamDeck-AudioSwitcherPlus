name: Prepare release
on:
  workflow_call:
jobs:
  release:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: shared/VERSION
          sparse-checkout-cone-mode: false
      - name: Check the tag matches shared/VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < shared/VERSION)"
          # A prerelease tag like "0.2.0-beta1" matches on the part before the "-".
          if [ "${tag%%-*}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match shared/VERSION ($version)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Display downloaded files
        run: ls -R
        working-directory: ${{ runner.temp }}/artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/artifacts/exe-plugin/*.streamDeckPlugin
            ${{ runner.temp }}/artifacts/node-plugin/*.streamDeckPlugin
            ${{ runner.temp }}/artifacts/exe-symbols/*.pdb
